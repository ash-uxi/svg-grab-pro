# One click: checks, a date version (e.g. 26.10.23), a GitHub Release, then both stores.
# Modelled on refined-github's release workflow (fregante/ghatemplates webext).
name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Dry run (check store credentials; no tag, release or submission)
        type: boolean
        default: false

permissions:
  contents: read

concurrency: release

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the tag and create the GitHub Release.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Tag today's version (only if there are new commits)
        id: tag
        if: ${{ !inputs.dry-run }}
        uses: fregante/daily-version-action@4bd6944b98e29a3d1b130677012fb1e4ffddc31d # v3.1.0
      - name: Choose version
        id: version
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          CREATED: ${{ steps.tag.outputs.created }}
          TAGGED: ${{ steps.tag.outputs.version }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "version=$(date -u +%y.%-m.%-d)" >> "$GITHUB_OUTPUT"
          elif [ -n "$CREATED" ]; then
            echo "version=$TAGGED" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Nothing new since the last release ($TAGGED), so nothing to ship."
          fi
      - name: Package ${{ steps.version.outputs.version }}
        if: steps.version.outputs.version
        run: npm run package
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - if: steps.version.outputs.version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*.zip
          if-no-files-found: error
      - name: Create GitHub Release
        if: steps.version.outputs.version && !inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" dist/*.zip --title "$VERSION" --generate-notes

  submit:
    name: Submit to Chrome Web Store and Firefox Add-ons
    needs: package
    if: needs.package.outputs.version
    runs-on: ubuntu-latest
    environment: stores
    # No checkout: only the zips are needed, and repo files must not end up in an upload.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: AMO release notes link to the GitHub Release
        run: >
          echo '{"version":{"release_notes":{"en-US":"https://github.com/${{ github.repository }}/releases/tag/${{ needs.package.outputs.version }}"}}}'
          > amo-metadata.json
      - name: Submit
        # Keep in step with the publish-browser-extension devDependency.
        run: >
          npx --yes --package publish-browser-extension@6.2.0 publish-extension
          --chrome-zip "dist/svg-grab-pro-$VERSION.zip"
          --firefox-zip "dist/svg-grab-pro-$VERSION.zip"
          --firefox-sources-zip "dist/svg-grab-pro-$VERSION-sources.zip"
          ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          VERSION: ${{ needs.package.outputs.version }}
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: svg-grab-pro@ashuxi
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: listed
          FIREFOX_COMPATIBILITY: firefox # Desktop only; the right-click menu needs a mouse.
          FIREFOX_AMO_METADATA_FILE: amo-metadata.json
