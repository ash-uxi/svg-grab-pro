<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>SVG Grab Pro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="brand-mark" data-icon="brand"></span>
        <div class="brand-text">
          <h1>SVG Grab Pro</h1>
          <p class="site" id="site">&nbsp;</p>
        </div>
      </div>
      <button class="button" id="downloadAll" type="button" disabled>
        <span data-icon="archive"></span><span id="downloadAllLabel">Download all</span>
      </button>
    </header>

    <nav class="toolbar" aria-label="Filters">
      <div class="segmented" role="tablist" aria-label="Show">
        <button role="tab" type="button" data-filter="all" aria-selected="true">
          All <span class="count" id="countAll"></span>
        </button>
        <button role="tab" type="button" data-filter="logos" aria-selected="false">
          Logos <span class="count" id="countLogos"></span>
        </button>
      </div>
      <div class="segmented segmented-icons" role="radiogroup" aria-label="Preview background">
        <button
          type="button"
          role="radio"
          data-backdrop="auto"
          title="Transparent"
          aria-checked="true"
        >
          <span class="swatch swatch-checker"></span>
        </button>
        <button
          type="button"
          role="radio"
          data-backdrop="light"
          title="On light"
          aria-checked="false"
        >
          <span class="swatch swatch-light"></span>
        </button>
        <button
          type="button"
          role="radio"
          data-backdrop="dark"
          title="On dark"
          aria-checked="false"
        >
          <span class="swatch swatch-dark"></span>
        </button>
      </div>
    </nav>

    <main class="content" id="content" aria-live="polite"></main>

    <footer class="bottom">
      <label class="setting">
        <span class="switch">
          <input type="checkbox" id="allSites" role="switch" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </span>
        <span class="setting-text">
          <span class="setting-title">All sites</span>
          <span class="setting-hint">Right-click without opening this first</span>
        </span>
      </label>
      <div class="segmented segmented-icons" role="radiogroup" aria-label="Theme">
        <button
          type="button"
          role="radio"
          data-theme="system"
          title="Match system"
          aria-checked="true"
        >
          <span data-icon="monitor"></span>
        </button>
        <button type="button" role="radio" data-theme="light" title="Light" aria-checked="false">
          <span data-icon="sun"></span>
        </button>
        <button type="button" role="radio" data-theme="dark" title="Dark" aria-checked="false">
          <span data-icon="moon"></span>
        </button>
      </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
